<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    opacity: 0;

  .page-section.visible {

    transform: translateY(0);
  }
  .page-section img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ===== Video Link Overlay (Page 23) ===== */
  .video-link-area {
    position: relative;
    display: block;
  }
  .video-hitbox {
    position: absolute;
    right: 3%;
    top: 16%;
    width: 21%;
    height: 73%;
    border: 1px solid rgba(30, 30, 30, 0.12);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .video-hitbox svg {
    width: 22px;
    height: 22px;
    opacity: 0;
    transform: translateY(4px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .video-hitbox .hitbox-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: rgba(30, 30, 30, 0);
    transition: color 0.3s ease;
  }
  .video-link-area:hover .video-hitbox {
    border-color: rgba(30, 30, 30, 0.28);
    background: rgba(255, 255, 255, 0.25);
  }
  .video-link-area:hover .video-hitbox svg {
    opacity: 0.45;
    transform: translateY(0);
  }
  .video-link-area:hover .video-hitbox .hitbox-label {
    color: rgba(30, 30, 30, 0.45);
  }

  /* ===== Side Progress Indicator ===== */
  .progress-bar {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 90;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .progress-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
    transition: all 0.3s;
  }
  .progress-dot.active {
    background: #1a1a1a;
    transform: scale(1.4);
  }
  @media (max-width: 768px) {
    .progress-bar { display: none; }
  }

  /* ===== Bottom Nav ===== */
  .bottom-nav {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 90;
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 100px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  .bottom-nav button {
    border: none;
    background: none;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 100px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .bottom-nav button:hover, .bottom-nav button.active {
    background: #1a1a1a;
    color: #fff;
  }
  @media (max-width: 768px) {
    .bottom-nav { display: none; }
  }

  /* ===== Footer ===== */

    text-align: center;
    padding: 40px 20px;
    color: #999;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
</style>

<script>
(function() {
  // ===== Intersection Observer for fade-in =====
  const sections = document.querySelectorAll('.page-section');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15 });
  sections.forEach(s => observer.observe(s));

  // ===== Active nav highlighting =====
  const navButtons = document.querySelectorAll('.bottom-nav button');
  const navLinks = document.querySelectorAll('.nav-links a');
  const groups = ['cover', 'about', 'film', 'ecommerce', 'design', 'videos'];

  function updateActiveNav() {
    const scrollPos = window.scrollY + window.innerHeight / 2;
    let currentGroup = 'cover';
    groups.forEach(g => {
      const el = document.querySelector(`[data-group="${g}"]`);
      if (el && el.offsetTop <= scrollPos) currentGroup = g;
    });
    navButtons.forEach(b => {
      b.classList.toggle('active', b.dataset.target === currentGroup);
    });
  }
  window.addEventListener('scroll', updateActiveNav, { passive: true });

  // ===== Bottom nav smooth scroll =====
  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.target;
      const el = document.getElementById(target);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    });
  });

  // ===== Progress dots =====
  const progressBar = document.getElementById('progressBar');
  groups.forEach((g, i) => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.dataset.group = g;
    dot.addEventListener('click', () => {
      const el = document.getElementById(g);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    });
    progressBar.appendChild(dot);
  });

  // Update active dot
  function updateDots() {
    const dots = document.querySelectorAll('.progress-dot');
    const scrollPos = window.scrollY + window.innerHeight / 2;
    let currentGroup = 'cover';
    groups.forEach(g => {
      const el = document.querySelector(`[data-group="${g}"]`);
      if (el && el.offsetTop <= scrollPos) currentGroup = g;
    });
    dots.forEach(d => {
      d.classList.toggle('active', d.dataset.group === currentGroup);
    });
  }
  window.addEventListener('scroll', updateDots, { passive: true });

  // ===== Hide nav on scroll down, show on scroll up =====
  let lastScroll = 0;
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    const currentScroll = window.scrollY;
    if (currentScroll > 100 && currentScroll > lastScroll + 5) {
      nav.classList.add('hidden');
    } else if (currentScroll < lastScroll - 5) {
      nav.classList.remove('hidden');
    }
    lastScroll = currentScroll;
  }, { passive: true });

  // ===== Keyboard navigation =====
  document.addEventListener('keydown', (e) => {
    const currentIdx = groups.indexOf(document.querySelector('.progress-dot.active')?.dataset.group || 'cover');
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      const next = groups[Math.min(currentIdx + 1, groups.length - 1)];
      const el = document.getElementById(next);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const prev = groups[Math.max(currentIdx - 1, 0)];
      const el = document.getElementById(prev);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  });
})();
</script>
